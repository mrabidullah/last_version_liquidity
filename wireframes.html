<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Screen map | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc;
var NOTES={client:'One company (or several, then it behaves like the multi-company client). Joins through a company-based sign-up link. Sees the same Team as everyone else on that company; can manage it only if made a company manager.',
 multi:'Several companies behind one login. Lands on the company directory, then opens a company. The company switcher in the top bar changes every page, including the Team.',
 guest:'Invited from a Team page. Read-only and limited to the assigned companies. No Team, Subscription or Support pages, in the menu or by direct URL.',
 admin:'Deltablock staff. Manages companies, users, sign-up links, access requests, profile reviews and subscriptions, and can open any company workspace and Team.'};
var ORDER=['client','multi','guest','admin'];
var PAGES=[
 ['dashboard.html','Overview','Client, guest, admin (scoped)','Headline numbers, peers, contribution'],
 ['market.html','Market activity','Client, admin (scoped)','Price, volume, participation, spread'],
 ['trades.html','Trade history','Client, guest, admin (scoped)','Trade list'],
 ['comparison.html','Peer comparison','Client, admin (scoped)','Anonymised peer groups'],
 ['reports.html','Reports','Client, guest, admin (scoped)','Published PDFs'],
 ['accounting.html','Statements','Client, admin (scoped)','Invoices and statements'],
 ['subscription.html','Subscription','Client, admin (scoped)','Plan and renewal for the selected company. The plan never changes which pages are available'],
 ['company.html','Company profile','Client, admin (scoped)','Managers submit changes for review; others and admins view'],
 ['team.html','Team','Client, admin (scoped)','Company-based Team; managers invite, edit and remove'],
 ['tickets.html','Support / Support tickets','Client, admin','Ticket list and new ticket'],
 ['ticket.html','Ticket conversation','Client, admin','Messages on one ticket'],
 ['companies.html','Companies','Multi-company client, admin','Directory, Open, Team; admin: Add company'],
 ['admin.html','Admin overview','Admin','What needs attention'],
 ['signup-links.html','Client sign-up links','Admin','Create company-based links'],
 ['access-requests.html','Access requests','Admin','Approve or reject; create a link or add a missing company'],
 ['profile-reviews.html','Profile reviews','Admin','Compare approved and proposed values; approve or reject'],
 ['users.html','Users','Admin','Company tags, Edit access, manager rights, Add admin'],
 ['admin-subscriptions.html','Subscriptions','Admin','Assign plan and dates per company'],
 ['data-health.html','Data health','Admin','Feed freshness'],
 ['access-log.html','Access log','Admin','Searchable sign-in log'],
 ['wireframes.html','Screen map','Admin','This page'],
 ['login.html','Sign in / Request access','Everyone','Persona shortcuts or an account email'],
 ['signup.html','Create account','Link or invitation holder','Registration from a sign-up link, Team invite or admin setup link'],
 ['guest-invite.html','Accept guest invitation','Guest invitee','Read-only guest setup'],
 ['password-reset.html','Password reset','Everyone','Prototype confirmation page']
];
var MATRIX=[
 ['See company workspace pages','All companies','Assigned companies','Assigned companies','Assigned companies, read-only: Overview, Trade history, Reports'],
 ['View the Team','Every company','Yes','Yes','No'],
 ['Invite, edit access, cancel, remove','Every company','Only companies they manage','No','No'],
 ['Submit company profile changes','No (reviews them)','Only companies they manage','No','No'],
 ['Subscription and Support pages','Yes','Yes','Yes','No'],
 ['Admin pages and actions','Yes','No','No','No']
];
function flow(t,steps,links){return '<div class="rounded-md border p-4"><strong>'+t+'</strong><ol class="mt-2 list-decimal space-y-1 pl-5 text-sm text-mut">'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol><div class="mt-3 flex flex-wrap gap-2">'+links.map(function(l){return '<a class="btn btn-s" href="'+l[1]+'">'+l[0]+'</a>';}).join('')+'</div></div>';}
App.mount({page:'wireframes',title:'Screen map',roles:['admin'],render:function(ctx){
 var cards=ORDER.map(function(r){var R=App.ROLES[r];return '<section class="card p-5"><div class="mb-2 flex items-center justify-between gap-2"><h2 class="font-semibold">'+esc(R.label)+'</h2><span class="bd dr">Lands on '+esc(R.homeName)+'</span></div><p class="mb-3 text-sm text-mut">'+esc(NOTES[r])+'</p><ol class="mb-4 space-y-1 rounded-md bg-hov p-4 text-sm">'+App.NAV[r].map(function(n){return '<li><span class="mono text-xs text-cap">'+esc(n[0])+'</span> &nbsp;'+esc(n[1])+'</li>';}).join('')+'</ol><button class="btn btn-p" data-as="'+r+'">Open as '+esc(R.label.toLowerCase())+'</button></section>';}).join('');
 var sample=App.links().filter(function(l){return App.linkState(l)==='unused';})[0],guest=App.people().filter(function(p){return p.type==='guest'&&p.status==='pending';})[0];
 var matrix='<section class="card mt-5 overflow-x-auto p-5"><h2 class="font-semibold">Who can do what</h2><p class="mt-1 text-sm text-mut">One permission model, enforced in the menu, in direct URLs, in buttons and in the functions that change saved data. Company access and Team management are separate: access lets someone see a company, manager rights let them run its Team.</p><table class="tbl mt-3 min-w-[760px]"><tr><th>Capability</th><th>Admin</th><th>Company manager</th><th>Other client user</th><th>Guest</th></tr>'+MATRIX.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i?'':' class="font-medium"')+'>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</table></section>';
 var flows='<section class="card mt-5 p-5"><h2 class="font-semibold">Workflows</h2><div class="mt-3 grid gap-4 md:grid-cols-2">'+
  flow('Add a company, then a sign-up link',['Admin opens Companies and chooses Add company','Fills identity fields; market data stays &ldquo;Not available&rdquo; if left blank','Duplicates are blocked; the company appears in Companies and the switcher','Admin creates a company-based sign-up link for it'],[['Companies','companies.html'],['Add company','companies.html?add=1']])+
  flow('Client joins with a company link',['Admin selects one or more companies; no name or email is asked','Recipient opens the link and enters their own name, email and password','Existing emails are rejected (case-insensitive) with a pointer to Log in; the link is not used up','Success creates the account with the link&rsquo;s companies and marks the link used'],[['Admin: sign-up links','signup-links.html'],['Client view of a link',sample?'signup.html?t='+sample.token:'signup.html']])+
  flow('Someone asks for access',['Visitor sends the Request access form on the login page','Admin approves or rejects in Access requests','Approved: Create sign-up link for the matching company, or Add company first when it is missing'],[['Login page form','login.html#request'],['Admin: access requests','access-requests.html']])+
  flow('Team belongs to the company',['Everyone with access to a company sees the same Team for it','Managers invite colleagues or guests, edit access and remove people, for their companies only','Admins open any Team from Companies; Users &rarr; Edit access sets access and manager rights'],[['Companies','companies.html'],['Admin: all users','users.html'],['Guest invitation',guest?'guest-invite.html?t='+guest.token:'guest-invite.html']])+
  flow('Company profile review',['A manager edits the profile and submits for review; the approved profile stays live','Admin compares current and proposed values in Profile reviews','Approve applies the values; Reject keeps the profile; both are recorded with date and reviewer'],[['Admin: profile reviews','profile-reviews.html']])+
  flow('Add admin and search the log',['Admin opens Users and chooses Add admin (first name, last name, email)','The new admin finishes setup from a setup link and then sees the admin menu','Access log search filters name, email, company and date, with pagination on the results'],[['Users','users.html'],['Access log','access-log.html']])+
  '</div></section>';
 var pages='<section class="card mt-5 overflow-x-auto p-5"><h2 class="font-semibold">Pages</h2><p class="mt-1 text-sm text-mut">Every screen in the prototype shares one sidebar and one top bar (company switcher, theme toggle, sign out). Subscription plans do not hide or disable any client page.</p><table class="tbl mt-3 min-w-[760px]"><tr><th>Page</th><th>Route</th><th>Who</th><th>Purpose</th></tr>'+PAGES.map(function(p){return '<tr><td><a class="underline" href="'+p[0]+'">'+esc(p[1])+'</a></td><td class="mono text-xs text-cap">'+esc(p[0])+'</td><td>'+esc(p[2])+'</td><td class="text-mut">'+esc(p[3])+'</td></tr>';}).join('')+'</table></section>';
 return '<div class="mb-8"><h1 class="page-title">Screen map</h1><p class="mt-2 text-sm text-mut">The reference for the implemented prototype: roles, menus, permissions, pages and workflows. Use the buttons to click through the portal as a role; sign out returns to the login page.</p></div><div class="grid gap-5 lg:grid-cols-2">'+cards+'</div>'+matrix+flows+pages;
},after:function(ctx,main){
 main.querySelectorAll('[data-as]').forEach(function(b){b.addEventListener('click',function(){location.href=App.login(b.dataset.as);});});
}});
})();
</script></body></html>
